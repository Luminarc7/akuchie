name: Probe Rakuten box
on: push
permissions: { contents: write }
jobs:
  probe:
    if: github.ref == 'refs/heads/claude/project-thread-6s8poi'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p probe_out
          ( B=https://staging-warujie.warujie-mtg.workers.dev
            for i in $(seq 1 20); do
              s=$(curl -s "$B/" | grep -o 'hs-strip\|startStripMotion' | head -1)
              [ -n "$s" ] && break; sleep 30; done
            sleep 120
            for k in sl box; do
              echo "== $k"; curl -s -A 'warujie-probe (+https://warujie.jp)' -D - "$B/shop/rakuten?kind=$k" | head -c 20000; echo
            done
            echo "== box fin"; curl -s "$B/shop/rakuten?kind=box&set=FINAL%20FANTASY" | head -c 6000
          ) > probe_out/rakuten.txt 2>&1 || true
          head -c 3000 probe_out/rakuten.txt
          git config user.name probe; git config user.email probe@users.noreply.github.com
          git add probe_out && git commit -m "probe result [skip ci]" && git push
