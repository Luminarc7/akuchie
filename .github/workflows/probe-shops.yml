name: Probe staging
on: push
permissions: { contents: write }
jobs:
  probe:
    if: github.ref == 'refs/heads/probe-shops'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p probe_out
          for u in https://staging-warujie.warujie-mtg.workers.dev/ https://warujie.warujie-mtg.workers.dev/; do
            echo "== $u" >> probe_out/enc.txt
            curl -sS -H "Accept-Encoding: gzip, br" -D - -o body.bin "$u?x=$GITHUB_SHA" | grep -iE '^(HTTP|content-encoding|cache-control|content-length)' >> probe_out/enc.txt
            wc -c < body.bin >> probe_out/enc.txt
          done
          git config user.name probe; git config user.email probe@users.noreply.github.com
          git add probe_out && git commit -m "probe result [skip ci]" && git push
