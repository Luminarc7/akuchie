name: Probe staging
on: push
permissions: { contents: write }
jobs:
  probe:
    if: github.ref == 'refs/heads/probe-shops'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p probe_out
          mkdir -p probe_out/data
          curl -sS -o probe_out/data/tags.json.gz https://warujie.github.io/warujie-prices/t/tags.json.gz
          curl -sS -o probe_out/data/index.json https://warujie.github.io/warujie-prices/index.json || true
          ls -la probe_out/data > probe_out/data/ls.txt
          git config user.name probe; git config user.email probe@users.noreply.github.com
          git add probe_out && git commit -m "probe result [skip ci]" && git push
