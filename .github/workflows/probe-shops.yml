name: Probe staging
on: push
permissions: { contents: write }
jobs:
  probe:
    if: github.ref == 'refs/heads/probe-shops'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p probe_out
          S=https://staging-warujie.warujie-mtg.workers.dev
          O=probe_out/r14.txt
          for path in /manifest.webmanifest /sw.js /icons/icon-192.png /og.png /meta_lists/30-modern.json /tools/name_readings.py; do
            echo "== $path" >> $O
            curl -sS -D - -o body.bin "$S$path" | grep -iE '^(HTTP|content-type)' >> $O; wc -c < body.bin >> $O
          done
          for ua in "Twitterbot/1.0" "facebookexternalhit/1.1;line-poker/1.0" "Mozilla/5.0 (compatible; Discordbot/2.0; +https://discordapp.com)" "Mozilla/5.0 (iPhone; CPU iPhone OS 18_0 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/18.0 Mobile/15E148 Safari/604.1"; do
            for q in "?card=89ea9a01-a4e9-43c5-bdd7-3a0e4dcec0f3" "?view=deck&format=modern&days=30&deck=Broodscale" "?view=meta&format=legacy" "?set=mh2"; do
              echo "== $ua $q" >> $O
              curl -sS --compressed -A "$ua" "$S/$q" | grep -oE '<title>[^<]*|<meta (property|name)="(og:title|og:image|og:description|twitter:card)" content="[^"]*"' >> $O
            done
          done
          git config user.name probe; git config user.email probe@users.noreply.github.com
          git add probe_out && git commit -m "probe result [skip ci]" && git push
