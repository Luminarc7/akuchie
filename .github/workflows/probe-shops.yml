name: Probe staging
on: push
permissions: { contents: write }
jobs:
  probe:
    if: github.ref == 'refs/heads/probe-shops'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p probe_out
          for u in https://staging-warujie.warujie-mtg.workers.dev/; do
            echo "== $u" >> probe_out/staging.txt
            curl -sS -D - -o page.html "$u" | grep -iE '^(HTTP|x-robots|content-type|cache-control)' >> probe_out/staging.txt
            grep -o '<title>[^<]*' page.html >> probe_out/staging.txt
            grep -c 'cloudflareinsights' page.html >> probe_out/staging.txt || true
            sha256sum page.html >> probe_out/staging.txt
          done
          git config user.name probe; git config user.email probe@users.noreply.github.com
          git add probe_out && git commit -m "probe result [skip ci]" && git push
