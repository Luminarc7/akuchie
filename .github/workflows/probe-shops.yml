name: Probe staging
on: push
permissions: { contents: write }
jobs:
  probe:
    if: github.ref == 'refs/heads/probe-shops'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: |
          pip install -q sudachipy sudachidict_full
          mkdir -p probe_out
          python3 tools/name_readings.py ja_cards.json.gz probe_out/ja_cards_kana.json.gz > probe_out/readings_log.txt 2>&1
          python3 - >> probe_out/readings_log.txt <<'PY'
          import gzip, json
          d = json.loads(gzip.open('probe_out/ja_cards_kana.json.gz').read())
          F = d['fields']; i, k = F.index('name_ja'), F.index('name_kana')
          want = ['稲妻','意志の力','太陽の指輪','剣を鍬に','敏捷なこそ泥、ラガバン','渦まく知識','思考囲い','ウルザの物語','流刑への道','悪魔の教示者','極楽鳥','精神石','真面目な身代わり','とげの稲妻','霊気の薬瓶','死儀礼のシャーマン','冒涜の行動','否認','対抗呪文','闇の領域のリリアナ','虚空の杯','暗黒の儀式','吸血の教示者','頭蓋骨絞め','否定の力','激情','孤独','忍耐','緻密','神秘の教示者','時を解す者、テフェリー','ドミナリアの英雄、テフェリー','騙し討ち','実物提示教育','裂け目の突破','引き裂かれし永劫、エムラクール','オーコの陰謀','王冠泥棒、オーコ','燃え盛る大地','霧深い雨林']
          by = {r[i]: r[k] for r in d['cards'] if r[i]}
          for w in want: print(w, by.get(w))
          import random; random.seed(1)
          for r in random.sample([r for r in d['cards'] if r[i]], 40): print('RANDOM', r[i], r[k])
          PY
          git config user.name probe; git config user.email probe@users.noreply.github.com
          git add probe_out && git commit -m "probe result [skip ci]" && git push
