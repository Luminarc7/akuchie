name: Probe staging
on: push
permissions: { contents: write }
jobs:
  probe:
    if: github.ref == 'refs/heads/probe-shops'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p probe_out
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/140.0 Safari/537.36"
          for u in https://warujie.warujie-mtg.workers.dev/ https://warujie.jp/ https://www.warujie.jp/; do
            echo "== $u" >> probe_out/enc.txt
            curl -sS -A "$UA" -H "Accept: text/html" -H "Accept-Language: ja" -H "Accept-Encoding: gzip, br" -D - -o body.bin "$u" | grep -iE '^(HTTP|content-encoding|cache-control|cf-mitigated|server)' >> probe_out/enc.txt
            curl -sS -A "$UA" -H "Accept: text/html" --compressed "$u" -o page.html
            echo "beacon: $(grep -c cloudflareinsights page.html)  jsd: $(grep -c 'challenge-platform' page.html)  title: $(grep -o '<title>[^<]*' page.html)" >> probe_out/enc.txt
          done
          git config user.name probe; git config user.email probe@users.noreply.github.com
          git add probe_out && git commit -m "probe result [skip ci]" && git push
